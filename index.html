<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Blog of NightFlee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf6f0;
  --bg-alt: #f3ede4;
  --text: #3d3533;
  --text-light: #8c817b;
  --accent: #c27852;
  --accent-soft: #e8d5c8;
  --border: #e0d8ce;
  --ink: #2c2422;
  --tag-bg: #efe8df;
  --font-display: 'Playfair Display', 'Noto Serif SC', serif;
  --font-body: 'Crimson Text', 'Noto Serif SC', serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  font-size: 17px;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

h1, h2, h3, h4 { font-family: var(--font-display); color: var(--ink); font-weight: 600; }

a { color: var(--accent); text-decoration: none; transition: color 0.25s; }
a:hover { color: var(--ink); }

p { margin-bottom: 20px; }

.container { max-width: 680px; margin: 0 auto; padding: 0 24px; }

/* ===== NAVIGATION ===== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(250,246,240,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 960px; margin: 0 auto; padding: 14px 24px;
  display: flex; justify-content: space-between; align-items: center;
}
.nav-brand {
  font-family: var(--font-display); font-size: 18px; color: var(--ink);
  cursor: pointer; letter-spacing: 1px; user-select: none;
}
.nav-links { display: flex; gap: 24px; align-items: center; }
.nav-links a, .nav-links span {
  font-family: var(--font-display); font-size: 14px; color: var(--text-light);
  cursor: pointer; transition: color 0.25s; user-select: none;
}
.nav-links a:hover, .nav-links span:hover { color: var(--ink); }

.nav.transparent {
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border-bottom-color: transparent;
}
.nav.transparent .nav-brand,
.nav.transparent .nav-links a,
.nav.transparent .nav-links span { color: rgba(255,255,255,0.92); }
.nav.transparent .search-trigger svg { stroke: rgba(255,255,255,0.92); }

.search-trigger { display: flex; align-items: center; gap: 4px; }
.search-trigger svg { width: 15px; height: 15px; stroke: var(--text-light); }

/* ===== HERO ===== */
.hero {
  height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; position: relative;
  background: url('https://t.alcy.cc/ycy') center/cover no-repeat;
  background-attachment: fixed;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
}
.hero::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.45) 100%);
}
.hero-content { position: relative; z-index: 1; text-align: center; }
.hero-title {
  font-family: 'Noto Serif SC', var(--font-display);
  font-size: clamp(40px, 5.5vw, 68px); color: #f5f0e8;
  font-weight: 700; letter-spacing: 8px; margin-bottom: 16px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.35);
  animation: fadeUp 1s ease-out;
}
.hero-subtitle {
  font-size: 15px; color: rgba(245,240,232,0.8); letter-spacing: 6px;
  text-shadow: 0 1px 12px rgba(0,0,0,0.3);
  animation: fadeUp 1s ease-out 0.2s both;
}
.hero-arrow {
  position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
  z-index: 1; cursor: pointer; animation: bounce 2s infinite;
}
.hero-arrow svg { width: 28px; height: 28px; stroke: rgba(245,240,232,0.7); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes bounce {
  0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
  40% { transform: translateX(-50%) translateY(-10px); }
  60% { transform: translateX(-50%) translateY(-5px); }
}

/* ===== POST LIST ===== */
.post-list { padding: 80px 0; }
.post-card {
  padding: 32px 0; border-bottom: 1px dashed var(--border);
  cursor: pointer; transition: all 0.3s ease;
}
.post-card:hover { padding-left: 8px; }
.post-card:first-child { border-top: 1px dashed var(--border); }
.post-meta { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.post-category { font-size: 11px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
.post-date { font-size: 12px; color: var(--text-light); }
.post-card-title { font-family: var(--font-display); font-size: 22px; color: var(--ink); margin-bottom: 6px; }
.post-excerpt {
  font-size: 15px; color: var(--text-light); line-height: 1.7;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.post-tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.post-tag {
  font-size: 11px; background: var(--tag-bg); color: var(--accent);
  padding: 2px 10px; transition: all 0.2s;
}

/* ===== SECTION HEADERS ===== */
.section-header { text-align: center; padding: 100px 0 40px; }
.section-title { font-family: var(--font-display); font-size: 32px; color: var(--ink); letter-spacing: 2px; margin-bottom: 8px; }
.section-line { width: 40px; height: 1px; background: var(--accent); margin: 0 auto; }

/* ===== ARCHIVE ===== */
.archive-wrap { padding: 20px 0 80px; }
.archive-layout { display: grid; grid-template-columns: 1fr 280px; gap: 48px; max-width: 960px; margin: 0 auto; padding: 0 24px; }
.archive-timeline { min-height: 200px; }
.archive-year {
  font-family: var(--font-display); font-size: 22px; color: var(--ink);
  margin: 28px 0 12px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.archive-month { font-size: 12px; color: var(--accent); letter-spacing: 2px; margin: 16px 0 8px; }
.archive-post-item {
  padding: 8px 0; border-bottom: 1px dotted var(--border);
  cursor: pointer; transition: padding 0.2s;
}
.archive-post-item:hover { padding-left: 6px; color: var(--accent); }
.archive-post-item .aptitle { font-size: 15px; color: var(--text); }
.archive-post-item .apmeta { font-size: 11px; color: var(--text-light); margin-left: 8px; }

.archive-sidebar { }
.archive-sidebar-section { margin-bottom: 32px; }
.archive-sidebar-title {
  font-family: var(--font-display); font-size: 15px; color: var(--ink);
  margin-bottom: 12px; padding-bottom: 6px;
  border-bottom: 1px dotted var(--border); letter-spacing: 1px;
}
.archive-cat-item {
  padding: 4px 0; font-size: 14px; color: var(--text); cursor: pointer;
  transition: color 0.2s; display: flex; justify-content: space-between;
}
.archive-cat-item:hover, .archive-cat-item.active { color: var(--accent); }
.archive-cat-count { color: var(--text-light); font-size: 12px; }

.tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-cloud-item {
  font-size: 11px; background: var(--tag-bg); color: var(--accent);
  padding: 3px 10px; cursor: pointer; transition: all 0.2s;
}
.tag-cloud-item:hover, .tag-cloud-item.active { background: var(--accent); color: #fff; }

/* ===== ARTICLE ===== */
.article-page { padding: 120px 0 80px; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text-light); cursor: pointer; margin-bottom: 32px;
  transition: color 0.2s;
}
.back-link:hover { color: var(--accent); }
.article-header { text-align: center; margin-bottom: 48px; }
.article-title {
  font-family: var(--font-display);
  font-size: clamp(28px, 4vw, 40px); color: var(--ink);
  line-height: 1.3; margin-bottom: 16px;
}
.article-meta {
  display: flex; gap: 20px; justify-content: center; align-items: center;
  flex-wrap: wrap; font-size: 13px; color: var(--text-light);
}
.article-body { font-size: 17px; line-height: 2; color: var(--text); }
.article-body p { margin-bottom: 24px; }
.article-body h2 { font-size: 24px; margin: 48px 0 16px; }
.article-body blockquote {
  border-left: 3px solid var(--accent); padding: 8px 20px;
  margin: 24px 0; color: var(--text-light); font-style: italic;
}
.article-footer { margin-top: 60px; padding-top: 24px; border-top: 1px dashed var(--border); }
.article-footer-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; }
.article-footer-label { color: var(--text-light); font-size: 12px; }

/* ===== ABOUT ===== */
.about-page { padding: 120px 0 80px; }
.about-content { font-size: 17px; line-height: 2; max-width: 560px; margin: 0 auto; }

/* ===== SEARCH OVERLAY ===== */
.search-overlay {
  position: fixed; inset: 0; background: rgba(250,246,240,0.97);
  z-index: 200; display: none; flex-direction: column; align-items: center;
  padding: 120px 24px 40px; overflow-y: auto;
}
.search-overlay.open { display: flex; }
.search-overlay-close {
  position: absolute; top: 24px; right: 32px;
  font-size: 28px; cursor: pointer; color: var(--text-light);
  transition: color 0.2s;
}
.search-overlay-close:hover { color: var(--ink); }
.search-input {
  width: 100%; max-width: 520px;
  font-family: var(--font-display); font-size: 24px;
  border: none; border-bottom: 2px solid var(--border);
  background: transparent; color: var(--ink);
  padding: 12px 0; outline: none; transition: border-color 0.3s;
}
.search-input:focus { border-bottom-color: var(--accent); }
.search-input::placeholder { color: var(--text-light); opacity: 0.4; }
.search-results { width: 100%; max-width: 520px; margin-top: 24px; }
.search-result-item {
  padding: 14px 0; border-bottom: 1px dotted var(--border);
  cursor: pointer; transition: padding 0.2s;
}
.search-result-item:hover { padding-left: 8px; }
.search-result-title { font-family: var(--font-display); font-size: 17px; color: var(--ink); }
.search-result-excerpt { font-size: 13px; color: var(--text-light); margin-top: 4px; }
.search-hint { font-size: 12px; color: var(--text-light); opacity: 0.6; margin-top: 8px; }

/* ===== VIEW MANAGEMENT ===== */
.view { display: none; }
.view.active { display: block; }

/* ===== EMPTY STATE ===== */
.empty-state { text-align: center; color: var(--text-light); padding: 60px 0; font-size: 15px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .archive-layout { grid-template-columns: 1fr; gap: 32px; }
  .archive-sidebar { order: -1; display: flex; gap: 24px; flex-wrap: wrap; }
  .archive-sidebar-section { flex: 1; min-width: 140px; margin-bottom: 0; }
  .nav-inner { padding: 12px 16px; }
  .nav-links { gap: 14px; }
  .nav-links a, .nav-links span { font-size: 13px; }
  .post-card { padding: 24px 0; }
  .nav-brand { font-size: 16px; }
  .post-list { padding: 60px 0; }
  .article-page { padding: 100px 0 60px; }
  .hero { background-attachment: scroll; }
}

@media (max-width: 480px) {
  .container { padding: 0 16px; }
  .hero-title { font-size: 36px; letter-spacing: 3px; }
  .section-title { font-size: 26px; }
  .article-title { font-size: 24px; }
  .archive-sidebar { flex-direction: column; gap: 16px; }
}
</style>
</head>
<body>

<!-- Navigation -->
<nav class="nav" id="nav">
  <div class="nav-inner">
    <div class="nav-brand" onclick="location='index.html'" title="首页">nightflee</div>
    <div class="nav-links">
      <a onclick="showView('archive')">归档</a>
      <a onclick="showView('about')">关于</a>
      <span class="search-trigger" onclick="toggleSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        搜索
      </span>
    </div>
  </div>
</nav>

<!-- Hero Banner -->
<section class="hero" id="hero">
  <div class="hero-content">

  </div>
  <div class="hero-arrow" onclick="scrollToPosts()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>

</section>

<!-- Home: Post List -->
<section class="view active" id="view-home">

</section>

<!-- Archive -->
<section class="view" id="view-archive">
  <div class="section-header">
    <h2 class="section-title">归档</h2>
    <div class="section-line"></div>
  </div>
  <div class="archive-wrap">
    <div class="archive-layout">
      <div class="archive-timeline" id="archiveTimeline"></div>
      <div class="archive-sidebar">
        <div class="archive-sidebar-section">
          <div class="archive-sidebar-title">分类</div>
          <div id="archiveCategories"></div>
        </div>
        <div class="archive-sidebar-section">
          <div class="archive-sidebar-title">标签</div>
          <div class="tag-cloud" id="archiveTags"></div>
        </div>
      </div>

</section>

<!-- Article Detail -->
<section class="view" id="view-article">

</section>

<!-- About -->
<section class="view" id="view-about">
  <div class="container about-page">
    <div class="section-header">
      <h2 class="section-title">关于</h2>
      <div class="section-line"></div>
    </div>
    <div class="about-content">
      <p>这里是一个安静的角落，用来存放随笔、读书笔记和日常思考。</p>
      <p>喜欢在文字里寻找秩序，也享受偶然的混乱。相信记录是最好的思考方式。</p>
      <p>如果你偶然路过，希望你也能在这里找到片刻宁静。</p>
      <p style="margin-top:32px;font-size:13px;color:var(--text-light)">—— nightflee</p>
    </div>
  </div>
</section>

<!-- Search Overlay -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-overlay-close" onclick="toggleSearch()">&times;</div>

</div>

<script>
// ===== DATA =====
var posts = [
  { id:1, title:'春日午后的一场慢走', category:'随笔', date:'2024-03-15', tags:['散文','生活','春天'], excerpt:'三月的阳光透过梧桐叶的缝隙洒下来，斑驳的光影在地面上轻轻晃动。我放慢了脚步，才发现原来每天匆匆路过的这条街，有这么多被忽略的风景。', body:'<p>三月的阳光透过梧桐叶的缝隙洒下来，斑驳的光影在地面上轻轻晃动。我放慢了脚步，才发现原来每天匆匆路过的这条街，有这么多被忽略的风景。</p><p>街角那家旧书店的老板正在门口浇花，看到我停下来，笑着点了点头。书架上的旧书在阳光下散发着好闻的纸张味道。我挑了一本泛黄的诗集，坐在靠窗的位置，度过了一个安静的下午。</p><blockquote>生活不必匆忙，慢下来才能看见光。</blockquote><p>回来的路上买了刚出炉的面包，热乎乎的，捧在手里像一个温暖的秘密。</p>' },
  { id:2, title:'读《瓦尔登湖》有感', category:'读书', date:'2024-03-02', tags:['阅读','梭罗','哲学'], excerpt:'梭罗说，我到林中去，因为我希望谨慎地生活，只面对生活的基本事实。这句话在忙碌的都市生活中显得格外有分量。', body:'<p>梭罗说，我到林中去，因为我希望谨慎地生活，只面对生活的基本事实。这句话在忙碌的都市生活中显得格外有分量。</p><p>我们每天被无数信息轰炸，手机、邮件、社交网络……似乎永远在处理别人的期待。梭罗选择在瓦尔登湖畔独居两年，不是为了逃避，而是为了更清醒地活着。</p><h2>关于简化</h2><p>简化生活并不意味着减少快乐。恰恰相反，当我们去掉冗余，留下的东西才真正属于自己。这本书让我开始思考：我每天做的事情，有多少是真正必要的？</p><p>或许我们都需要一片自己的"瓦尔登湖"——不一定是真正的湖泊，可以是每天早上安静喝咖啡的十分钟，也可以是周末独自散步的一小时。</p>' },
  { id:3, title:'Python 异步编程学习笔记', category:'笔记', date:'2024-01-20', tags:['Python','编程','asyncio'], excerpt:'整理了一段时间以来关于 asyncio 的学习心得。异步编程的核心不是多线程，而是协作式多任务——在等待 I/O 的时候让出控制权。', body:'<p>整理了一段时间以来关于 asyncio 的学习心得。异步编程的核心不是多线程，而是协作式多任务——在等待 I/O 的时候让出控制权。</p><h2>事件循环</h2><p>事件循环是 asyncio 的心脏。它维护一个任务队列，不断检查哪些任务可以继续执行。当一个任务遇到 await 时，它将控制权交还给事件循环，后者可以调度其他任务。这种模型非常适合 I/O 密集型场景。</p><h2>async/await 语法</h2><p>Python 3.5 引入的 async/await 让异步代码看起来几乎和同步代码一样。但要注意：async 函数返回的是一个协程对象，需要被事件循环调度才能执行。</p><blockquote>异步编程的难点不在于语法，而在于思维模式的转变——从"顺序执行"到"协作调度"。</blockquote>' },
  { id:4, title:'京都秋日游记', category:'旅行', date:'2023-11-08', tags:['旅行','日本','京都','秋天'], excerpt:'京都的秋天像一幅缓缓展开的画卷。红叶、古寺、石板路，每一个转角都藏着几百年的时光。', body:'<p>京都的秋天像一幅缓缓展开的画卷。红叶、古寺、石板路，每一个转角都藏着几百年的时光。</p><p>第一站去了岚山。竹林小径比想象中更幽深，风吹过竹叶发出沙沙的声响，让人不由自主地放低声音。从天龙寺出来，沿着桂川散步，对岸的山上已经染上了深深浅浅的红。</p><h2>永观堂的夜枫</h2><p>晚上去了永观堂看夜枫。灯光打在红叶上，整座庭院像被点燃了一样。池水倒映着红枫和月光，美得不真实。坐在廊下看了很久，想起王维的诗句——"明月松间照，清泉石上流"。</p><h2>路边咖啡馆</h2><p>在哲学之道附近发现了一家小小的咖啡馆，只有五个座位。店主是一位七十多岁的老先生，手冲咖啡的动作慢而精准，像在进行某种仪式。那杯咖啡的味道，现在还能想起来。</p>' },
  { id:5, title:'茶事三则', category:'随笔', date:'2023-09-12', tags:['茶','生活','散文'], excerpt:'关于茶的三件小事。第一件：用紫砂壶泡铁观音，第一泡要倒掉，这叫"醒茶"。如同每天早起的第一杯水，叫醒的不只是茶叶。', body:'<p>关于茶的三件小事。</p><h2>一、醒茶</h2><p>用紫砂壶泡铁观音，第一泡要倒掉，这叫"醒茶"。如同每天早起的第一杯水，叫醒的不只是茶叶，还有自己。</p><h2>二、茶杯的温度</h2><p>冬天泡茶，一定要先用热水温杯。冰凉的茶杯倒进热茶，茶水瞬间降温，香气也散了大半。做人做事也是一样——先暖场，再投入。</p><h2>三、最后一泡</h2><p>一壶茶泡到第五六泡，味道已经淡了很多。有人觉得寡然无味，有人却能品出淡淡的甜。同样一杯茶，不同的心境，不同的滋味。生活大概也是如此。</p>' },
  { id:6, title:'关于摄影的一些想法', category:'笔记', date:'2023-07-25', tags:['摄影','艺术','随笔'], excerpt:'摄影教会我最重要的一课是：好的照片不是拍出来的，是等出来的。等待光线、等待情绪、等待那个恰到好处的瞬间。', body:'<p>摄影教会我最重要的一课是：好的照片不是拍出来的，是等出来的。等待光线、等待情绪、等待那个恰到好处的瞬间。</p><h2>器材的陷阱</h2><p>刚学摄影时总以为更好的器材能拍出更好的照片。后来发现，决定性的是镜头后面那个人的眼睛和心。器材只是工具，不是答案。</p><h2>构图之外</h2><p>三分法、引导线、对称构图……这些规则很重要，但更重要的是：你想通过这张照片表达什么？如果一张照片技术上完美但毫无情感，那它只是一张漂亮的墙纸。</p><p>我越来越喜欢那些"不完美"的照片——失焦的、晃动的、构图奇怪的——因为它们真实。</p>' },
  { id:7, title:'A Quiet Morning Routine', category:'随笔', date:'2023-05-18', tags:['生活','英文','morning'], excerpt:'There is something sacred about the first hour of the day. No notifications, no demands, just the soft light creeping through the curtains.', body:'<p>There is something sacred about the first hour of the day. No notifications, no demands, just the soft light creeping through the curtains.</p><p>My morning routine has evolved over the years, but a few things remain constant: a glass of warm water, ten minutes of sitting quietly with my thoughts, and a cup of tea made just the way I like it.</p><p>I used to reach for my phone the moment I woke up. Breaking that habit was difficult, but it changed everything. Now the first thing I touch in the morning is a book, or sometimes just the cool surface of the windowsill as I look outside.</p><blockquote>The morning is the most important part of the day. Start it well, and everything else follows.</blockquote><p>Give yourself a quiet morning. The world can wait.</p>' },
  { id:8, title:'搭建个人知识管理系统的思考', category:'笔记', date:'2023-03-30', tags:['效率','笔记方法','知识管理'], excerpt:'花了半年时间摸索适合自己的知识管理系统。最终发现，工具不重要，重要的是"写下来"这个动作本身。', body:'<p>花了半年时间摸索适合自己的知识管理系统。最终发现，工具不重要，重要的是"写下来"这个动作本身。</p><h2>走过的弯路</h2><p>Notion、Obsidian、Logseq、Roam Research……几乎试过了所有主流工具。每次都觉得"这个就是最好的"，然后花大量时间配置插件、设计模板、美化界面——唯独忘了真正去记录和思考。</p><h2>现在的做法</h2><p>放弃了对"完美系统"的追求。现在我的方法很简单：</p><p>1. 临时想法 → 手机备忘录（5秒记录）<br>2. 碎片笔记 → Markdown 文件（每天整理10分钟）<br>3. 深度文章 → 经过整理的长文（每周一篇）</p><p>工具用的是最简单的文件夹 + Markdown + 全文搜索。没有任何花哨的功能，但足够好用。</p><blockquote>写作即思考。不要把时间花在打磨工具上，要花在打磨思想上。</blockquote>' }
];

// ===== HELPERS =====
function formatDate(dateStr) {
  var d = new Date(dateStr);
  var months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  return d.getFullYear() + '年' + months[d.getMonth()] + d.getDate() + '日';
}

// ===== VIEW MANAGEMENT =====
var currentView = 'home';
var currentPostId = null;
var filteredForHome = null;
var isPopState = false;

function showView(view, data) {
  currentView = view;

  // Hide all views
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  var target = document.getElementById('view-' + view);
  if (target) target.classList.add('active');

  // Hide hero for non-home views
  var hero = document.getElementById('hero');
  if (view === 'home') {
    hero.style.display = '';
    hero.style.transform = '';
    hero.style.position = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    hero.style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'instant' });
    setTimeout(function() { window.scrollTo({ top: 0, behavior: 'instant' }); }, 10);
  }

  if (view === 'archive') renderArchive();
  if (view === 'article' && data) renderArticle(data);
  if (view === 'home') {
    filteredForHome = null;
    renderPostList();
    setTimeout(updateNavTransparency, 200);
  }

  // Push history state (skip during popstate to avoid loop)
  if (!isPopState) {
    var state = { view: view };
    if (data) state.postId = data;
    var hash = view === 'home' ? '' : view;
    history.pushState(state, '', '#' + hash);
  }

  // Close search
  if (document.getElementById('searchOverlay').classList.contains('open')) {
    toggleSearch();
  }

  // Update active nav style
  updateNavActive(view);
}

// Handle browser back/forward
window.addEventListener('popstate', function(e) {
  isPopState = true;
  if (e.state && e.state.view) {
    showView(e.state.view, e.state.postId || null);
  } else {
    showView('home');
  }
  isPopState = false;
});

function updateNavActive(view) {
  var links = document.querySelectorAll('.nav-links a');
  links.forEach(function(a) {
    if (a.textContent === '归档' && view === 'archive') a.style.color = 'var(--ink)';
    else if (a.textContent === '关于' && view === 'about') a.style.color = 'var(--ink)';
    else a.style.color = '';
  });
}

function goHome() {
  showView('home');
  updateNavTransparency();
}

// ===== HERO =====
function scrollToPosts() {
  var hero = document.getElementById('hero');
  hero.style.transform = 'translateY(-100vh)';
  hero.style.position = 'absolute';
  window.scrollTo({ top: window.innerHeight, behavior: 'smooth' });
}

// Reset hero when scrolling back to top on homepage
function updateNavTransparency() {
  var nav = document.getElementById('nav');
  var hero = document.getElementById('hero');
  if (currentView === 'home' && hero.style.display !== 'none' && window.scrollY < window.innerHeight - 100) {
    nav.classList.add('transparent');
  } else {
    nav.classList.remove('transparent');
  }
}

var ticking = false;
window.addEventListener('scroll', function() {
  if (!ticking) {
    requestAnimationFrame(function() {
      if (currentView === 'home') {
        var hero = document.getElementById('hero');
        if (window.scrollY < 100 && hero.style.transform) {
          hero.style.transform = '';
          hero.style.position = '';
        }
      }
      updateNavTransparency();
      ticking = false;
    });
    ticking = true;
  }
});

// ===== POST LIST =====
function renderPostList(filteredPosts) {
  var list = filteredPosts || posts;
  var container = document.getElementById('postList');
  container.innerHTML = list.map(function(p) {
    return '<article class="post-card" onclick="showView(\'article\', ' + p.id + ')">' +
      '<div class="post-meta">' +
        '<span class="post-category">' + p.category + '</span>' +
        '<span class="post-date">' + formatDate(p.date) + '</span>' +
      '</div>' +
      '<h2 class="post-card-title">' + p.title + '</h2>' +
      '<p class="post-excerpt">' + p.excerpt + '</p>' +
      '<div class="post-tags">' +
        p.tags.map(function(t) { return '<span class="post-tag">' + t + '</span>'; }).join('') +
      '</div>' +
    '</article>';
  }).join('');

  if (list.length === 0) {
    container.innerHTML = '<p class="empty-state">没有找到匹配的文章</p>';
  }
}

// ===== ARTICLE =====
function renderArticle(postId) {
  currentPostId = postId;
  var p = posts.find(function(x) { return x.id === postId; });
  if (!p) return showView('home');

  var container = document.getElementById('articleContent');
  container.innerHTML =
    '<div class="back-link" onclick="goBack()">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>' +
      '返回首页' +
    '</div>' +
    '<div class="article-header">' +
      '<h1 class="article-title">' + p.title + '</h1>' +
      '<div class="article-meta">' +
        '<span>' + formatDate(p.date) + '</span>' +
        '<span>·</span>' +
        '<span>' + p.category + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="article-body">' + p.body + '</div>' +
    '<div class="article-footer">' +
      '<div class="article-footer-row">' +
        '<span class="article-footer-label">分类：</span>' +
        '<span class="post-tag" style="cursor:pointer" onclick="filterByCategory(\'' + p.category + '\')">' + p.category + '</span>' +
      '</div>' +
      '<div class="article-footer-row">' +
        '<span class="article-footer-label">标签：</span>' +
        p.tags.map(function(t) { return '<span class="post-tag" style="cursor:pointer" onclick="filterByTag(\'' + t + '\')">' + t + '</span>'; }).join('') +
      '</div>' +
    '</div>';
}

function goBack() {
  if (history.length > 2) {
    history.back();
  } else {
    showView('home');
  }
}

function filterByCategory(cat) {
  showView('archive');
  setTimeout(function() {
    archiveFilter = { category: cat, tag: null };
    renderArchiveTimeline();
    renderArchiveSidebar();
  }, 50);
}

function filterByTag(tag) {
  showView('archive');
  setTimeout(function() {
    archiveFilter = { category: null, tag: tag };
    renderArchiveTimeline();
    renderArchiveSidebar();
  }, 50);
}

// ===== ARCHIVE =====
var archiveFilter = { category: null, tag: null };

function renderArchive() {
  archiveFilter = { category: null, tag: null };
  renderArchiveTimeline();
  renderArchiveSidebar();
}

function getFilteredPosts() {
  var result = posts;
  if (archiveFilter.category) result = result.filter(function(p) { return p.category === archiveFilter.category; });
  if (archiveFilter.tag) result = result.filter(function(p) { return p.tags.indexOf(archiveFilter.tag) !== -1; });
  return result;
}

function renderArchiveTimeline() {
  var container = document.getElementById('archiveTimeline');
  var filtered = getFilteredPosts();

  var grouped = {};
  filtered.forEach(function(p) {
    var d = new Date(p.date);
    var year = d.getFullYear();
    var month = d.getMonth() + 1;
    if (!grouped[year]) grouped[year] = {};
    if (!grouped[year][month]) grouped[year][month] = [];
    grouped[year][month].push(p);
  });

  var monthNames = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var years = Object.keys(grouped).sort(function(a,b) { return b-a; });
  var html = '';

  if (filtered.length === 0) {
    html = '<p class="empty-state">没有匹配的文章</p>';
  } else {
    years.forEach(function(year) {
      html += '<div class="archive-year">' + year + '</div>';
      var months = Object.keys(grouped[year]).sort(function(a,b) { return b-a; });
      months.forEach(function(month) {
        html += '<div class="archive-month">' + monthNames[parseInt(month)] + '</div>';
        grouped[year][month].forEach(function(p) {
          html +=
            '<div class="archive-post-item" onclick="showView(\'article\', ' + p.id + ')">' +
              '<span class="aptitle">' + p.title + '</span>' +
              '<span class="apmeta">— ' + p.category + ' · ' + p.tags.slice(0,2).join(' / ') + '</span>' +
            '</div>';
        });
      });
    });
  }

  container.innerHTML = html;
}

function renderArchiveSidebar() {
  // Categories
  var catCounts = {};
  posts.forEach(function(p) { catCounts[p.category] = (catCounts[p.category] || 0) + 1; });
  document.getElementById('archiveCategories').innerHTML = Object.keys(catCounts).map(function(cat) {
    var count = catCounts[cat];
    var active = archiveFilter.category === cat ? ' active' : '';
    return '<div class="archive-cat-item' + active + '" onclick="setArchiveFilter(\'category\', \'' + cat + '\')">' +
      '<span>' + cat + '</span><span class="archive-cat-count">' + count + '</span></div>';
  }).join('');

  // Tags
  var tagCounts = {};
  posts.forEach(function(p) { p.tags.forEach(function(t) { tagCounts[t] = (tagCounts[t] || 0) + 1; }); });
  document.getElementById('archiveTags').innerHTML = Object.keys(tagCounts)
    .sort(function(a,b) { return tagCounts[b] - tagCounts[a]; })
    .map(function(tag) {
      var count = tagCounts[tag];
      var active = archiveFilter.tag === tag ? ' active' : '';
      return '<span class="tag-cloud-item' + active + '" onclick="setArchiveFilter(\'tag\', \'' + tag + '\')">' + tag + ' (' + count + ')</span>';
    }).join('');
}

function setArchiveFilter(type, value) {
  if (archiveFilter[type] === value) {
    archiveFilter[type] = null;
  } else {
    archiveFilter[type] = value;
  }
  renderArchiveTimeline();
  renderArchiveSidebar();
}

// ===== SEARCH =====
function toggleSearch() {
  var overlay = document.getElementById('searchOverlay');
  var input = document.getElementById('searchInput');
  overlay.classList.toggle('open');
  if (overlay.classList.contains('open')) {
    input.value = '';
    document.getElementById('searchResults').innerHTML = '';
    setTimeout(function() { input.focus(); }, 150);
  }
}

function doSearch() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var container = document.getElementById('searchResults');
  if (!q) { container.innerHTML = ''; return; }

  var results = posts.filter(function(p) {
    return p.title.toLowerCase().indexOf(q) !== -1 ||
           p.excerpt.toLowerCase().indexOf(q) !== -1 ||
           p.body.toLowerCase().indexOf(q) !== -1 ||
           p.tags.some(function(t) { return t.toLowerCase().indexOf(q) !== -1; }) ||
           p.category.toLowerCase().indexOf(q) !== -1;
  });

  container.innerHTML = results.length === 0
    ? '<p class="empty-state">未找到相关文章</p>'
    : results.map(function(p) {
      return '<div class="search-result-item" onclick="showView(\'article\', ' + p.id + ')">' +
        '<div class="search-result-title">' + p.title + '</div>' +
        '<div class="search-result-excerpt">' + p.excerpt.substring(0, 80) + '...</div></div>';
    }).join('');
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    var overlay = document.getElementById('searchOverlay');
    if (overlay.classList.contains('open')) {
      toggleSearch();
      e.preventDefault();
    }
  }
  if (e.key === '/' && document.activeElement === document.body) {
    e.preventDefault();
    var overlay = document.getElementById('searchOverlay');
    if (!overlay.classList.contains('open')) {
      toggleSearch();
    }
  }
});

// ===== INIT =====
// Replace initial page state so browser back from an article returns to home view
history.replaceState({ view: 'home' }, '', '');

renderPostList();

// Set nav transparent initially
setTimeout(updateNavTransparency, 100);

// Handle initial load with hash
window.addEventListener('DOMContentLoaded', function() {
  var hash = window.location.hash;
  if (hash === '#archive') showView('archive');
  else if (hash === '#about') showView('about');
  updateNavTransparency();
});
</script>
</body>
